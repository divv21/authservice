spring.application.name=authservice
server.port=9898

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/authservice?createDatabaseIfNotExist=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update



logging.level.org.springframework.security=INFO
logging.level.your.package.name=INFO

jwt.secret=${JWT_SECRET}
#jwt.expiration=${JWT_EXPIRATION}
#jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=com.expensetracker.authservice.serializer.UserInfoSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.topic-json.name=user_service
spring.kafka.producer.properties.spring.json.type.mapping=auth:authservice.model.UserInfoEvent

spring.threads.virtual.enabled=true

debug=true
